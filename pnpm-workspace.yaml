packages:
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  unrs-resolver: true

catalogMode: prefer

catalog:
  '@tailwindcss/vite': ^4.3.2
  '@tanstack/react-query': ^5.101.2
  '@tanstack/react-router': ^1.170.16
  '@tanstack/router-plugin': ^1.168.18
  '@types/cors': ^2.8.19
  '@types/express': ^5.0.6
  '@types/supertest': ^7.2.1
  cheerio: ^1.2.0
  cors: ^2.8.6
  dotenv: ^17.2.4
  express: ^5.2.1
  lucide-react: ^1.23.0
  pino: ^10.3.1
  pino-http: ^11.0.0
  pino-pretty: ^13.1.3
  react-spinners: ^0.17.0
  recharts: ^3.10.1
  supertest: ^7.2.2
  tailwindcss: ^4.3.2

catalogs:
  # Build tooling
  build:
    turbo: ^2.x
    vite: ^8.1.1

  # Language, runtime and framework core
  core:
    '@types/node': ^24.x
    '@types/react': ^19.x
    '@types/react-dom': ^19.x
    react: ^19.x
    react-dom: ^19.x
    tsx: ^4.x
    typescript: ^6.x

  # Database
  db:
    '@prisma/adapter-pg': ^7.8.0
    '@prisma/client': ^7.8.0
    '@types/pg': ^8.20.0
    pg: ^8.22.0
    prisma: ^7.8.0

  # Linting / Formatting
  lint:
    '@eslint/js': ^9.x
    '@next/eslint-plugin-next': ^15.x
    eslint: ^9.x
    eslint-config-prettier: ^10.x
    eslint-plugin-n: ^18.x
    eslint-plugin-react: ^7.x
    eslint-plugin-react-hooks: ^7.x
    prettier: ^3.x
    typescript-eslint: ^8.x

  # Testing
  test:
    '@testing-library/jest-dom': ^6.x
    '@testing-library/react': ^16.x
    '@testing-library/user-event': ^14.x
    '@vitejs/plugin-react': ^6.x
    '@vitest/coverage-v8': ^4.x
    jsdom: ^27.x
    vitest: ^4.x
engineStrict: true
